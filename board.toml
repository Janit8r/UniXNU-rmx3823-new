schema_version = 2

[board]
example = false
name = "rmx3823"
soc = "SM8550"
soc_source = "sm8550"
os_profile = "ipados-17.7.11-21H461"
description = "realme GT5 240W (RMX3823), kalama, 24 GiB, 1240x2772 AMOLED"
kit = "rmx3823"

[components]
include = ["ArmDTPlatform", "ArmCpu", "SoftwareAES", "XnuPrelink", "DarwinBoot"]

[kernel]
defconfig = "rmx3823_defconfig"

# The packaging script selects the defconfig of each OS profile from [package.defconfig].
config_fragments = ["arch:configs/common.config", "soc:configs/sm8550.config", "os:configs/ipados.config"]
patch_series = ["arch:patches/xnu/series", "soc:patches/xnu/series", "os:patches/xnu/series", "device:patches/xnu/series"]

[device_tree]
source = "device:dts/board.dts"
include_dirs = ["soc:dts"]

[firmware]
# Scripts that run before the firmware build, with UNIXNU_UEFI set to the firmware
# checkout: build the firmware device tree the boot image carries, check the memory map.
# preflight = ["scripts/check-rmx3823-firmware.py"]

# The uefi-rmx3823 checkout does not exist yet. These paths are the intended layout.
config = "rmx3823"
dsc = "Platforms/Qualcomm/Rmx3823Pkg/Rmx3823Pkg.dsc"
fd = "Build/Rmx3823Pkg/{target}_CLANGPDB/FV/SILICIUM_UEFI.fd"
packages = ["{uefi}", "{tree}/package", "{tree}/drivers/DarwinBoot", "{edk2}"]

[bootimg]
# The device tree of the boot image, relative to the build tree; a firmware preflight
# script builds it (docs/porting/packaging.md).
# dtb = "build/rmx3823/rmx3823.dtb"

[firmware.defines]
DEVICE_MODEL = "RMX3823"

[payload]
volume = "RMX3823"
size_mib = 192
loader = "firmware"
title = "UniXNU"
kernel_args = ["-v", "serial=3"]

[package]
# The UniXNU checkout, relative to this repository: scripts/package.sh reads it.
unixnu = "../UniXNU"

[package.defconfig]
"ipados-17.7.11-21H461" = "rmx3823_defconfig"

[payload.adt]
# 0x207 = 519 = SM8550 soc_id, read from /sys/devices/soc0/soc_id on the device.
# Supply the board's identity seed through --unique-chip-id.
chip_id = "207"
unique_chip_id = "required"
