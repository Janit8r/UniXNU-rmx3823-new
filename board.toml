schema_version = 2

[board]
example = false
name = "rmx3823"
soc = "SM8550"
soc_source = "sm8550"
os_profile = "ipados-17.7.11-21H461"
description = "realme GT5 240W (RMX3823), kalama, 24 GiB, 1240x2772 AMOLED"
kit = "rmx3823"

[components]
include = ["ArmDTPlatform", "ArmCpu", "SoftwareAES", "XnuPrelink", "DarwinBoot"]

[kernel]
defconfig = "rmx3823_defconfig"

# The packaging script selects the defconfig of each OS profile from [package.defconfig].
config_fragments = ["arch:configs/common.config", "soc:configs/sm8550.config", "os:configs/ipados.config"]
patch_series = ["arch:patches/xnu/series", "soc:patches/xnu/series", "os:patches/xnu/series", "device:patches/xnu/series"]

[device_tree]
source = "device:dts/board.dts"
include_dirs = ["soc:dts"]

[firmware]
# Scripts that run before the firmware build, with UNIXNU_UEFI set to the firmware
# checkout: build the firmware device tree the boot image carries, check the memory map.
# preflight = ["scripts/check-rmx3823-firmware.py"]

# The uefi-rmx3823 checkout (a fork of UniXNU/uefi-sheng, branch sheng). Pass it with
# ./unixnu build firmware --uefi ../uefi-rmx3823
#
# rmx3823Pkg is derived from Platforms/Qualcomm/qrd8550Pkg, the SM8550 reference
# design, and carries the UniXNU integration in its DSC/FDF/DXE.inc the same way
# shengPkg does. It is therefore NOT buildable with the Mu-Silicium build_uefi.py:
# that path has no PACKAGES_PATH for UniXNUPkg or DarwinBootPkg.
config = "rmx3823"
dsc = "Platforms/Qualcomm/rmx3823Pkg/rmx3823.dsc"
fd = "Build/rmx3823Pkg/{target}_CLANGPDB/FV/SILICIUM_UEFI.fd"

# Mu_Basecore is deliberately absent: the engine supplies it as {edk2}.
submodules = [
  "Binaries",
  "Common/Mu",
  "Common/Mu_OEM_Sample",
  "Silicon/Qualcomm",
  "Silicon/Silicium",
  "Silicium-ACPI",
]

# PACKAGES_PATH. {uefi} is the uefi-rmx3823 checkout, {edk2} is Mu_Basecore, {tree}
# is the assembled build tree of this repository.
packages = [
  "{uefi}",
  "{uefi}/Common/Mu",
  "{uefi}/Common/Mu_OEM_Sample",
  "{uefi}/Silicon/Qualcomm",
  "{uefi}/Silicon/Silicium",
  "{uefi}/Silicium-ACPI",
  "{uefi}/Silicium-ACPI/Platforms/Qualcomm",
  "{uefi}/Silicium-ACPI/Silicon/Qualcomm",
  "{tree}/package",
  "{tree}/drivers/DarwinBoot",
  "{edk2}",
]

[bootimg]
# The device tree of the boot image, relative to the build tree; a firmware preflight
# script builds it (docs/porting/packaging.md).
# dtb = "build/rmx3823/rmx3823.dtb"

[firmware.defines]
# FD_BASE, FD_SIZE and FD_BLOCKS are supplied by the engine from
# Resources/Configs/rmx3823.toml [uefi_fd], so they must not be repeated here.
#
# DEVICE_MODEL is intentionally absent: rmx3823 has a single hardware model, and
# rmx3823.dsc never branches on it.

[payload]
volume = "RMX3823"
size_mib = 192
loader = "firmware"
title = "UniXNU"
kernel_args = ["-v", "serial=3"]

[package]
# The UniXNU checkout, relative to this repository: scripts/package.sh reads it.
unixnu = "../UniXNU"

[package.defconfig]
"ipados-17.7.11-21H461" = "rmx3823_defconfig"

[payload.adt]
# 0x207 = 519 = SM8550 soc_id, read from /sys/devices/soc0/soc_id on the device.
# Supply the board's identity seed through --unique-chip-id.
chip_id = "207"
unique_chip_id = "required"
